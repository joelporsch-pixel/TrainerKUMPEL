    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* SF Westenfeld Green System (#006D34) */
        .sfw-green { color: #006D34; }
        .sfw-bg { background-color: #006D34 !important; }
        .sfw-bg-dark { background-color: #005227 !important; }
        .sfw-border { border-color: #006D34 !important; }
        
        .modal-anim { animation: fadeIn 0.22s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.97); } 
            to { opacity: 1; transform: scale(1); } 
        }
        
        #loader-overlay {
            position: fixed; inset: 0; background: #ffffff; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease;
        }
        .spinner { 
            border: 4px solid #e6f0eb; 
            border-top: 4px solid #006D34; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        input, select, textarea { 
            color: #0f172a !important; 
            font-weight: 700 !important; 
            background-color: #ffffff !important; 
            border: 2px solid #cbd5e1 !important; 
            padding: 0.8rem !important; 
            border-radius: 0.75rem !important; 
            width: 100%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #006D34 !important;
            box-shadow: 0 0 0 3px rgba(0, 109, 52, 0.15) !important;
        }

        .label-dark { 
            color: #1e293b !important; 
            font-weight: 800 !important; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            margin-bottom: 0.4rem; 
            display: block; 
        }
        .btn-save { 
            background-color: #006D34 !important; 
            color: white !important; 
            font-weight: 900 !important; 
            padding: 1rem 2.5rem; 
            border-radius: 1.25rem; 
            text-transform: uppercase; 
            box-shadow: 0 10px 15px -3px rgba(0, 109, 52, 0.3); 
            transition: all 0.2s; 
        }
        .btn-save:hover { 
            background-color: #005227 !important; 
            transform: translateY(-2px); 
        }
        .btn-save:disabled { 
            background-color: #94a3b8 !important; 
            transform: none; 
            box-shadow: none; 
            cursor: not-allowed; 
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #006D34; border-radius: 10px; }
    </style>
</head>
<body>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyCyeBZWO12eswCR9lYFJR07cm4ljIrhkqY",
            authDomain: "trainerkumpel.firebaseapp.com",
            projectId: "trainerkumpel",
            storageBucket: "trainerkumpel.firebasestorage.app",
            messagingSenderId: "274423185184",

        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "sfw_titan_v18_planner";

        // Application Constants
        const MEDIUM_OPTIONS = ['Trainingsform', 'Taktikvideo'];
        const AGE_GROUPS = ['G-Jugend', 'F-Jugend', 'E-Jugend', 'D-Jugend', 'C-Jugend', 'B-Jugend', 'A-Jugend', 'Herren'];
        const PLAYER_COUNTS = ['1-4 Spieler', '5-8 Spieler', '9-12 Spieler', '13-17 Spieler', '18-22 Spieler'];
        const TRAINING_BLOCKS = ['A - Aufwärmen', 'I - Individuell', 'K - Kollektiv', 'LD - Letztes Drittel', 'S - Spiel'];
        const GAME_PHASES = ['Offensiv (Angreifen)', 'Defensiv (Verteidigen)'];
        const USER_ROLES = ['Trainer', 'Redakteur', 'admin'];

        // Icon Helper Component
        const iconMap = {
            'shield': 'fa-solid fa-shield-halved', 'plus': 'fa-solid fa-plus', 'search': 'fa-solid fa-magnifying-glass',
            'play-circle': 'fa-regular fa-circle-play', 'users': 'fa-solid fa-users', 'clock': 'fa-regular fa-clock',
            'maximize': 'fa-solid fa-expand', 'target': 'fa-solid fa-bullseye', 'list': 'fa-solid fa-list',
            'check-circle': 'fa-regular fa-circle-check', 'download': 'fa-solid fa-download', 'trash-2': 'fa-regular fa-trash-can',
            'upload-cloud': 'fa-solid fa-cloud-arrow-up', 'save': 'fa-solid fa-floppy-disk', 'lock': 'fa-solid fa-lock',
            'fingerprint': 'fa-solid fa-fingerprint', 'alert-triangle': 'fa-solid fa-triangle-exclamation',
            'youtube': 'fa-brands fa-youtube', 'instagram': 'fa-brands fa-instagram', 'link': 'fa-solid fa-link',
            'edit': 'fa-solid fa-pen-to-square', 'calendar': 'fa-regular fa-calendar-days', 'list-check': 'fa-solid fa-list-check',
            'arrow-left': 'fa-solid fa-arrow-left', 'check': 'fa-solid fa-check', 'video': 'fa-solid fa-video',
            'user-gear': 'fa-solid fa-user-gear', 'user-plus': 'fa-solid fa-user-plus', 'sign-out': 'fa-solid fa-right-from-bracket',
            'key': 'fa-solid fa-key', 'user-shield': 'fa-solid fa-user-shield', 'user': 'fa-solid fa-user',
            'circle-info': 'fa-solid fa-circle-info', 'film': 'fa-solid fa-film', 'pen-nib': 'fa-solid fa-pen-nib'
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const faClass = iconMap[name] || 'fa-solid fa-circle';
            return <i className={`${faClass} ${className}`} style={{ fontSize: size }}></i>;
        };

        const validateStrongPassword = (pwd) => {
            if (!pwd || pwd.length < 12) return "Das Passwort muss mindestens 12 Zeichen lang sein.";
            if (!/[a-z]/.test(pwd)) return "Das Passwort muss mindestens einen Kleinbuchstaben enthalten.";
            if (!/[A-Z]/.test(pwd)) return "Das Passwort muss mindestens einen Großbuchstaben enthalten.";
            if (!/[0-9]/.test(pwd)) return "Das Passwort muss mindestens eine Zahl enthalten.";
            if (!/[^a-zA-Z0-9]/.test(pwd)) return "Das Passwort muss mindestens ein Sonderzeichen (z.B. !@#$%^&*) enthalten.";
            return null;
        };

        // Cache for loaded media chunk strings to avoid repeated Firestore requests
        const mediaMemoryCache = {};

        const storeMediaChunks = async (mediaDataUrl) => {
            const chunkSize = 750000;
            const totalChunks = Math.ceil(mediaDataUrl.length / chunkSize);
            const mediaId = 'media_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            const mediaCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('media_chunks');
            
            for (let i = 0; i < totalChunks; i++) {
                const chunkStr = mediaDataUrl.substring(i * chunkSize, (i + 1) * chunkSize);
                await mediaCol.doc(`${mediaId}_chunk_${i}`).set({
                    mediaId,
                    chunkIndex: i,
                    totalChunks,
                    data: chunkStr,
                    createdAt: Date.now()
                });
            }
            mediaMemoryCache[mediaId] = mediaDataUrl;
            return mediaId;
        };

        const loadMediaFromChunks = async (mediaId) => {
            if (!mediaId) return null;
            if (mediaMemoryCache[mediaId]) return mediaMemoryCache[mediaId];
            try {
                const mediaCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('media_chunks');
                const snap = await mediaCol.where('mediaId', '==', mediaId).get();
                if (snap.empty) return null;
                
                const docs = snap.docs.map(d => d.data());
                docs.sort((a, b) => a.chunkIndex - b.chunkIndex);
                const fullMedia = docs.map(d => d.data).join('');
                mediaMemoryCache[mediaId] = fullMedia;
                return fullMedia;
            } catch (err) {
                console.error("Error loading media chunks:", err);
                return null;
            }
        };

        const deleteMediaChunks = async (mediaId) => {
            if (!mediaId) return;
            delete mediaMemoryCache[mediaId];
            try {
                const mediaCol = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('media_chunks');
                const snap = await mediaCol.where('mediaId', '==', mediaId).get();
                const batch = db.batch();
                snap.docs.forEach(d => batch.delete(d.ref));
                await batch.commit();
            } catch (err) {
                console.error("Error deleting media chunks:", err);
            }
        };

        // Create a compressed thumbnail from data URL for crisp card previews
        const generateThumbnail = (dataUrl, maxWidth = 480) => {
            return new Promise((resolve) => {
                if (!dataUrl || !dataUrl.startsWith('data:image')) {
                    resolve(dataUrl);
                    return;
                }
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        };

        const MediaImage = ({ exercise, className = "" }) => {
            const [displayUrl, setDisplayUrl] = React.useState(exercise.mediaUrl || '');
            const [isLoading, setIsLoading] = React.useState(!exercise.mediaUrl && !!exercise.mediaChunkId);

            React.useEffect(() => {
                let isMounted = true;
                if (!exercise.mediaUrl && exercise.mediaChunkId) {
                    setIsLoading(true);
                    loadMediaFromChunks(exercise.mediaChunkId).then(data => {
                        if (isMounted) {
                            setDisplayUrl(data || '');
                            setIsLoading(false);
                        }
                    });
                } else {
                    setDisplayUrl(exercise.mediaUrl || '');
                    setIsLoading(false);
                }
                return () => { isMounted = false; };
            }, [exercise.id, exercise.mediaUrl, exercise.mediaChunkId]);

            if (isLoading) {
                return (
                    <div className={`w-full h-full flex flex-col items-center justify-center bg-slate-900 text-slate-400 ${className}`}>
                        <div className="spinner border-t-emerald-500 w-8 h-8"></div>
                        <span className="text-[9px] font-black uppercase tracking-widest mt-2 text-slate-400">Lade Grafik...</span>
                    </div>
                );
            }

            if (!displayUrl) {
                return (
                    <div className={`w-full h-full flex flex-col items-center justify-center bg-slate-800 text-slate-400 ${className}`}>
                        <Icon name="maximize" size={32} className="opacity-40 mb-1" />
                        <span className="text-[10px] font-black uppercase tracking-widest">Keine Vorschau</span>
                    </div>
                );
            }

            return (
                <img 
                    src={displayUrl} 
                    className={className} 
                    alt={exercise.title || "Übungsgrafik"} 
                    onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = 'https://placehold.co/600x400/0f172a/ffffff?text=Bild+Fehler';
                    }} 
                />
            );
        };

        function App() {
            // Authentication & User State
            const [currentUser, setCurrentUser] = React.useState(null);
            const [loginUsername, setLoginUsername] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState('');
            const [isAuthenticating, setIsAuthenticating] = React.useState(false);

            // Force Password Change Modal State
            const [forcePwdNew, setForcePwdNew] = React.useState('');
            const [forcePwdConfirm, setForcePwdConfirm] = React.useState('');
            const [forcePwdError, setForcePwdError] = React.useState('');
            const [isForceSaving, setIsForceSaving] = React.useState(false);

            // Members state
            const [members, setMembers] = React.useState([]);

            // Main exercises state & filters
            const [exercises, setExercises] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filters, setFilters] = React.useState({ 
                medium: 'Alle', 
                age: 'Alle', 
                players: 'Alle', 
                block: 'Alle', 
                phase: 'Alle' 
            });
            
            const [selectedExercise, setSelectedExercise] = React.useState(null);
            const [exerciseMediaUrl, setExerciseMediaUrl] = React.useState(null);
            const [isLoadingMedia, setIsLoadingMedia] = React.useState(false);

            const [isFormOpen, setIsFormOpen] = React.useState(false);
            const [editingId, setEditingId] = React.useState(null);
            
            // Trainingsplaner state
            const [showPlanner, setShowPlanner] = React.useState(false);
            const [plannerAge, setPlannerAge] = React.useState('Herren');
            const [plannerSlots, setPlannerSlots] = React.useState([null, null, null, null, null]);
            const [selectingForSlot, setSelectingForSlot] = React.useState(null);
            const [isExportingPlan, setIsExportingPlan] = React.useState(false);
            
            // Admin Modal state
            const [showAdminModal, setShowAdminModal] = React.useState(false);
            const [adminTab, setAdminTab] = React.setAdminTab || React.useState('list');
            const [newMemberName, setNewMemberName] = React.useState('');
            const [newMemberUsername, setNewMemberUsername] = React.useState('');
            const [newMemberPassword, setNewMemberPassword] = React.useState('');
            const [newMemberRole, setNewMemberRole] = React.useState('Trainer');
            const [adminMsg, setAdminMsg] = React.useState({ text: '', type: '' });

            // Password reset modal state
            const [resetTargetUser, setResetTargetUser] = React.useState(null);
            const [newPasswordInput, setNewPasswordInput] = React.useState('');

            // Custom Notification Modal
            const [modalAlert, setModalAlert] = React.useState(null);

            const [isSaving, setIsSaving] = React.useState(false);
            const [formError, setFormError] = React.useState('');

            // Exercise Form State
            const [formState, setFormState] = React.useState({ 
                title: '', 
                medium: 'Trainingsform',
                trainingBlock: TRAINING_BLOCKS[0], 
                gamePhase: [], 
                ageGroup: [], 
                players: PLAYER_COUNTS[0], 
                duration: '', 
                fieldSizeTiefe: '', 
                fieldSizeBreite: '', 
                description: '', 
                procedure: '', 
                coachingPoints: '', 
                easier: '', 
                harder: '', 
                mediaUrl: '', 
                mediaChunkId: '',
                mediaType: 'image', 
                youtubeLink: '', 
                instagramLink: '' 
            });

            React.useEffect(() => {
                const loaderOverlay = document.getElementById('loader-overlay');
                const fallbackTimer = setTimeout(() => { if (loaderOverlay) loaderOverlay.style.display = 'none'; }, 3500);

                const initApp = async () => {
                    try { 
                        await auth.signInAnonymously(); 
                    } catch (e) { 
                        console.error("Auth error:", e); 
                    }
                };
                initApp();

                const unsubscribeAuth = auth.onAuthStateChanged(u => {
                    if (u) {
                        const exRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('exercises');
                        const stopSyncEx = exRef.onSnapshot(snap => {
                            const data = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            setExercises(data.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
                            if (loaderOverlay) loaderOverlay.style.display = 'none';
                            clearTimeout(fallbackTimer);
                        }, err => {
                            if (loaderOverlay) loaderOverlay.style.display = 'none';
                        });

                        const memRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('members');
                        const stopSyncMem = memRef.onSnapshot(snap => {
                            const mems = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            setMembers(mems);

                            const targetUsername = "adminsfw";
                            const hasAdmin = mems.some(m => m.username && m.username.toLowerCase() === targetUsername);
                            if (!hasAdmin) {
                                memRef.add({
                                    name: "Admin SFW",
                                    username: "AdminSFW",
                                    password: "SF_Westenfeld1965!",
                                    role: "admin",
                                    mustChangePassword: true,
                                    createdAt: Date.now()
                                });
                            }
                        }, err => console.error("Members sync error:", err));

                        return () => { stopSyncEx(); stopSyncMem(); };
                    }
                });

                const savedSession = localStorage.getItem('sfw_user_session');
                if (savedSession) {
                    try { setCurrentUser(JSON.parse(savedSession)); } catch(e) {}
                }

                return () => { unsubscribeAuth(); clearTimeout(fallbackTimer); };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                setIsAuthenticating(true);

                const cleanUsername = loginUsername.trim().toLowerCase();
                const cleanPassword = loginPassword.trim();

                setTimeout(() => {
                    const foundUser = members.find(m => m.username && m.username.toLowerCase() === cleanUsername && m.password === cleanPassword);
                    if (foundUser) {
                        const userData = { 
                            id: foundUser.id, 
                            name: foundUser.name, 
                            username: foundUser.username, 
                            role: foundUser.role,
                            mustChangePassword: !!foundUser.mustChangePassword
                        };
                        setCurrentUser(userData);
                        localStorage.setItem('sfw_user_session', JSON.stringify(userData));
                        setLoginUsername('');
                        setLoginPassword('');
                    } else {
                        setLoginError('Benutzername oder Passwort ist falsch.');
                    }
                    setIsAuthenticating(false);
                }, 400);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('sfw_user_session');
                setShowAdminModal(false);
                setShowPlanner(false);
                setSelectedExercise(null);
            };

                e.preventDefault();
                setForcePwdError('');

                if (forcePwdNew !== forcePwdConfirm) {
                    setForcePwdError('Die Passwörter stimmen nicht überein.');
                    return;
                }

                const validationErr = validateStrongPassword(forcePwdNew);
                if (validationErr) {
                    setForcePwdError(validationErr);
                    return;
                }

                setIsForceSaving(true);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('members').doc(currentUser.id).update({
                        password: forcePwdNew.trim(),
                        mustChangePassword: false
                    });

                    const updatedUser = { ...currentUser, mustChangePassword: false };
                    setCurrentUser(updatedUser);
                    localStorage.setItem('sfw_user_session', JSON.stringify(updatedUser));
                    setForcePwdNew('');
                    setForcePwdConfirm('');
                    setIsForceSaving(false);
                    setModalAlert({
                        title: "Passwort geändert",
                        msg: "Dein Passwort wurde erfolgreich aktualisiert. Willkommen bei TrainerKUMPEL!",
                        showCancel: false
                    });
                } catch (err) {
                    console.error(err);
                    setForcePwdError("Fehler beim Aktualisieren des Passworts.");
                    setIsForceSaving(false);
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                if (!newPasswordInput || !resetTargetUser) return;

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('members').doc(resetTargetUser.id).update({
                        password: newPasswordInput.trim(),
                        mustChangePassword: true
                    });
                    setResetTargetUser(null);
                    setNewPasswordInput('');
                    setAdminMsg({ text: 'Passwort zurückgesetzt. Nutzer muss es beim nächsten Login ändern.', type: 'success' });
                } catch (err) {
                    console.error(err);
                }
            };

            // Permissions Check: Admin and Redakteur can edit/create/delete
            const canEditContent = currentUser && (currentUser.role === 'admin' || currentUser.role === 'Redakteur');

            React.useEffect(() => {
                let isMounted = true;
                if (selectedExercise) {
                    if (selectedExercise.mediaChunkId) {
                        setIsLoadingMedia(true);
                        loadMediaFromChunks(selectedExercise.mediaChunkId).then(url => {
                            if (isMounted) {
                                setExerciseMediaUrl(url || selectedExercise.mediaUrl);
                                setIsLoadingMedia(false);
                            }

                    } else {
                        setExerciseMediaUrl(selectedExercise.mediaUrl);
                        setIsLoadingMedia(false);
                    }
                } else {
                    setExerciseMediaUrl(null);
                }
                return () => { isMounted = false; };
            }, [selectedExercise]);

            const getRequiredBlocks = (age) => {
                const isYounger = ['G-Jugend', 'F-Jugend', 'E-Jugend'].includes(age);

                    ? ['A - Aufwärmen', 'I - Individuell', 'S - Spiel', 'LD - Letztes Drittel', 'S - Spiel']
                    : ['A - Aufwärmen', 'I - Individuell', 'K - Kollektiv', 'LD - Letztes Drittel', 'S - Spiel'];
            };

            const currentRequiredBlocks = getRequiredBlocks(plannerAge);

            React.useEffect(() => {
                setPlannerSlots([null, null, null, null, null]);
            }, [plannerAge]);

                const newSlots = [...plannerSlots];

                setPlannerSlots(newSlots);
                setSelectingForSlot(null);

                setIsExportingPlan(true);

                            const chunkData = await loadMediaFromChunks(ex.mediaChunkId);
                            fullMediaMap[ex.id] = chunkData || ex.mediaUrl;
                        } else {

                }

                setIsExportingPlan(false);

                const win = window.open('', '', 'width=900,height=1000');
                let html = `
                    <html>

                        body { font-family: sans-serif; padding: 40px; color: #0f172a; }

            const handleCreateNew = () => {

                        }

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const maxBytes = 5 * 1024 * 1024; // 5 MB
                if (file.size > maxBytes) {
                    setModalAlert({
                        title: "Datei zu groß",
                        msg: "Die ausgewählte Datei ist zu groß. Es sind maximal 5 MB erlaubt.",
                        showCancel: false
                    });
                    return;
                }

                const isVideo = file.type.startsWith('video/');
                const reader = new FileReader();
                reader.onloadend = () => {
                    setFormState(p => ({ 
                        ...p, 
                        mediaUrl: reader.result, 
                        mediaChunkId: '',
                        mediaType: isVideo ? 'video' : 'image',
                        medium: isVideo ? 'Taktikvideo' : p.medium
                    }));
                };
                reader.readAsDataURL(file);
            };

            const saveExercise = async (e) => {
                if (e) e.preventDefault();
                if (isSaving) return;
                setFormError('');

                const isVideo = formState.medium === 'Taktikvideo';
                
                if (!formState.ageGroup.length || !formState.gamePhase.length || !formState.mediaUrl || !formState.title) {
                    setFormError("Bitte fülle alle mit * markierten Pflichtfelder aus.");
                    return;
                }

                // Field dimensions required ONLY for Trainingsform
                if (!isVideo && (!formState.fieldSizeTiefe || !formState.fieldSizeBreite)) {
                    setFormError("Bei einer Trainingsform sind Tiefe und Breite Pflichtfelder.");
                    return;
                }
                
                setIsSaving(true);
                try {
                    let chunkId = formState.mediaChunkId;
                    let storedUrl = formState.mediaUrl;

                    // If file is large (> 500KB), chunk it, but generate a compressed thumbnail for storedUrl so card previews always load instantly!
                    if (formState.mediaUrl.length > 500000) {
                        if (editingId && formState.mediaChunkId) {
                            await deleteMediaChunks(formState.mediaChunkId);
                        }
                        chunkId = await storeMediaChunks(formState.mediaUrl);
                        
                        if (formState.mediaType === 'image') {
                            storedUrl = await generateThumbnail(formState.mediaUrl, 480);
                        } else {
                            storedUrl = ''; // Videos don't store full dataUrl directly
                        }
                    }

                    const fieldSizeDisplay = isVideo && (!formState.fieldSizeTiefe && !formState.fieldSizeBreite)
                        ? 'Flexibel' 
                        : `${formState.fieldSizeTiefe || 0}m x ${formState.fieldSizeBreite || 0}m`;

                    const dataToSave = { 
                        title: formState.title,
                        medium: formState.medium,
                        trainingBlock: formState.trainingBlock,
                        gamePhase: formState.gamePhase,
                        ageGroup: formState.ageGroup,
                        players: formState.players,
                        duration: formState.duration,
                        fieldSizeTiefe: formState.fieldSizeTiefe || '',
                        fieldSizeBreite: formState.fieldSizeBreite || '',
                        fieldSize: fieldSizeDisplay,
                        description: formState.description || '',
                        procedure: formState.procedure,
                        coachingPoints: formState.coachingPoints,
                        easier: formState.easier || '',
                        harder: formState.harder || '',
                        mediaUrl: storedUrl,
                        mediaChunkId: chunkId,
                        mediaType: formState.mediaType,
                        youtubeLink: formState.youtubeLink || '',
                        instagramLink: formState.instagramLink || '',
                        updatedAt: Date.now() 
                    };
                    
                    const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('exercises');
                    
                    if (editingId) {
                        await ref.doc(editingId).update(dataToSave);
                    } else {
                        dataToSave.createdAt = Date.now();
                        await ref.add(dataToSave);
                    }
                    
                    setIsSaving(false);
                    setIsFormOpen(false);
                    setEditingId(null);

                win.document.close();

            const handleAddMember = async (e) => {

                const playerMatch = filters.players === 'Alle' || ex.players === filters.players;
                const blockMatch = filters.block === 'Alle' || ex.trainingBlock === filters.block;

                const searchMatch = (ex.title || '').toLowerCase().includes(searchTerm.toLowerCase());

                                    <div className="space-y-6">
                                        <div className="bg-emerald-50/60 p-8 rounded-[2.5rem] border-4 border-dashed border-emerald-200 text-center relative shadow-inner group">
                                            <input type="file" className="hidden" id="fileUpload" onChange={handleFileUpload} accept="image/*,video/*" />
                                            <label htmlFor="fileUpload" className="cursor-pointer font-black uppercase text-xs flex flex-col items-center gap-3">
                                                <Icon name="upload-cloud" size={44} className="sfw-green opacity-60 group-hover:opacity-100 transition-all" />
                                                <span className="sfw-green font-black text-base block uppercase tracking-widest">Grafik oder Video hochladen *</span>
                                                <span className="text-[11px] text-emerald-800 font-bold uppercase bg-white px-3 py-1 rounded-full border border-emerald-200 shadow-sm">
                                                    Max. Dateigröße: 5 MB (Bilder & Videos)
                                                </span>
                                            </label>

                                            {formState.mediaUrl && (
                                                <div className="mt-4 h-36 overflow-hidden rounded-2xl border-2 border-white bg-slate-900 flex items-center justify-center">
                                                    {formState.mediaType === 'video' ? (
                                                        <video src={formState.mediaUrl} controls className="max-h-full max-w-full" />
                                                    ) : (
                                                        <img src={formState.mediaUrl} className="max-h-full max-w-full object-contain" />
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="label-dark font-bold">Ablauf & Durchführung *</label>
                                            <textarea required className="h-28 font-bold" value={formState.procedure} onChange={e => setFormState({...formState, procedure: e.target.value})} placeholder="Detaillierte Beschreibung der Übung..." />
                                        </div>

                                        <div>
                                            <label className="label-dark font-bold">Coaching-Punkte *</label>
                                            <textarea required className="h-20 font-bold" value={formState.coachingPoints} onChange={e => setFormState({...formState, coachingPoints: e.target.value})} placeholder="Worauf achten die Trainer?" />
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="border-t-2 border-slate-100 pt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-emerald-50/60 p-5 rounded-[2rem] border-2 border-emerald-100">
                                        <label className="label-dark font-bold text-emerald-800">Erleichtern (Wie geht es einfacher?)</label>
                                        <textarea className="h-20 bg-white border-emerald-200" value={formState.easier} onChange={e => setFormState({...formState, easier: e.target.value})} placeholder="z.B. Feld vergrößern, Anspiel-Joker nutzen..." />
                                    </div>
                                    <div className="bg-red-50/60 p-5 rounded-[2rem] border-2 border-red-100">
                                        <label className="label-dark font-bold text-red-800">Erschweren (Wie geht es schwerer?)</label>
                                        <textarea className="h-20 bg-white border-red-200" value={formState.harder} onChange={e => setFormState({...formState, harder: e.target.value})} placeholder="z.B. Kontakte begrenzen, Zeitdruck erhöhen..." />
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-4 pt-4 border-t-4 border-slate-100 items-center justify-between">
                                    {formError && <p className="text-red-600 font-black text-xs uppercase animate-pulse">{formError}</p>}
                                    <div className="flex gap-4 ml-auto w-full sm:w-auto">
                                        <button 
                                            type="button" 
                                            onClick={() => { setIsFormOpen(false); setEditingId(null); }} 
                                            className="px-8 py-4 font-black uppercase text-xs text-slate-400 hover:text-slate-600"
                                        >
                                            Abbrechen
                                        </button>
                                        <button type="submit" disabled={isSaving} className="btn-save flex-1 sm:flex-initial flex items-center justify-center gap-3 text-xs tracking-widest">
                                            {isSaving ? <><div className="spinner w-5 h-5 border-2"></div> Speichere...</> : <><Icon name="save" size={18}/> {editingId ? 'Änderungen Speichern' : 'In Cloud Speichern'}</>}
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {}
                    {showPlanner && (
                        <div className="fixed inset-0 z-[110] bg-slate-950/95 flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-5xl my-auto p-8 md:p-12 space-y-8 shadow-2xl modal-anim relative">
                                <button onClick={() => setShowPlanner(false)} className="absolute top-8 right-8 text-4xl font-black text-slate-300 hover:text-emerald-700 transition-all">×</button>
                                
                                <div className="border-b-4 border-emerald-100 pb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                    <div>
                                        <div className="flex items-center gap-3 mb-2 sfw-green"><Icon name="list-check" size={28}/> <h2 className="text-3xl font-black uppercase italic leading-none">Trainingsplaner</h2></div>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Stelle dein Training bausteinweise zusammen.</p>
                                    </div>
                                    <div className="w-full md:w-64">
                                        <label className="label-dark font-bold text-emerald-800">Ziel-Altersklasse:</label>
                                        <select value={plannerAge} onChange={e => setPlannerAge(e.target.value)} className="font-black text-lg bg-emerald-50 border-emerald-200 text-emerald-950 cursor-pointer">
                                            {AGE_GROUPS.map(a => <option key={a} value={a}>{a}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {currentRequiredBlocks.map((blockName, index) => {
                                        const slotEx = plannerSlots[index];
                                        return (
                                            <div key={index} className="bg-white p-5 rounded-[2rem] border-2 border-slate-100 shadow-sm flex flex-col md:flex-row items-center gap-5 hover:border-emerald-200 transition-all group">
                                                <div className="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-800 font-black text-xl shrink-0 shadow-inner group-hover:scale-105 transition-transform">
                                                    {index + 1}
                                                </div>
                                                <div className="flex-1 w-full text-center md:text-left">
                                                    <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">{blockName}</h4>
                                                    {slotEx ? (
                                                        <div className="flex flex-col md:flex-row items-center gap-4">
                                                            <div className="w-16 h-12 bg-slate-900 rounded-lg overflow-hidden shrink-0 border border-slate-200 flex items-center justify-center">
                                                                {slotEx.mediaType === 'image' ? (
                                                                    <MediaImage exercise={slotEx} className="w-full h-full object-cover"/>
                                                                ) : (
                                                                    <Icon name="play-circle" size={20} className="text-emerald-500" />
                                                                )}
                                                            </div>
                                                            <div className="font-black text-slate-800 text-base uppercase leading-tight line-clamp-1">{slotEx.title}</div>
                                                            <span className="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-bold text-slate-500 uppercase shrink-0">{slotEx.medium || 'Trainingsform'}</span>
                                                        </div>
                                                    ) : (
                                                        <div className="text-slate-300 font-bold italic text-sm">Noch keine Übung für diesen Baustein ausgewählt.</div>
                                                    )}
                                                </div>
                                                <div className="shrink-0">
                                                    {slotEx ? (
                                                        <button onClick={() => { const newS = [...plannerSlots]; newS[index] = null; setPlannerSlots(newS); }} className="bg-red-50 text-red-600 w-12 h-12 rounded-xl flex items-center justify-center hover:bg-red-100 transition-all border border-red-100">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    ) : (
                                                        <button onClick={() => setSelectingForSlot(index)} className="sfw-bg text-white px-6 py-3 rounded-xl font-black uppercase text-xs shadow-md hover:sfw-bg-dark transition-all flex items-center gap-2">
                                                            <Icon name="plus" size={14} /> Wählen
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="pt-6 border-t-2 border-slate-100 flex justify-end">
                                    <button 
                                        onClick={exportFullPlan}
                                        disabled={plannerSlots.some(slot => slot === null) || isExportingPlan}
                                        className={`px-10 py-5 rounded-[2rem] font-black uppercase text-xs tracking-widest flex items-center gap-3 transition-all ${
                                            plannerSlots.some(slot => slot === null) || isExportingPlan
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                                : 'sfw-bg text-white shadow-xl hover:scale-105'
                                        }`}
                                    >
                                        {isExportingPlan ? (
                                            <><div className="spinner w-5 h-5 border-2"></div> Bereite PDF vor...</>
                                        ) : (
                                            <><Icon name="download" size={18}/> {plannerSlots.some(slot => slot === null) ? 'Fülle erst alle 5 Bausteine' : 'Trainingsplan als PDF drucken'}</>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SELECTOR MODAL FOR PLANNER */}
                    {selectingForSlot !== null && (
                        <div className="fixed inset-0 z-[120] bg-slate-950/95 flex items-center justify-center p-4 backdrop-blur-lg overflow-y-auto">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-6xl h-[85vh] flex flex-col shadow-2xl modal-anim relative">
                                <div className="p-8 border-b-2 border-slate-100 flex items-center justify-between shrink-0">
                                    <div>
                                        <h3 className="text-2xl font-black sfw-green uppercase tracking-tight mb-1">Übung auswählen</h3>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">
                                            Zeigt alle Übungen für Baustein: <span className="text-slate-800">{currentRequiredBlocks[selectingForSlot]}</span>
                                        </p>
                                    </div>
                                    <button onClick={() => setSelectingForSlot(null)} className="px-6 py-3 bg-slate-100 text-slate-600 rounded-2xl font-black uppercase text-xs flex items-center gap-2 hover:bg-slate-200 transition-all">
                                        <Icon name="arrow-left" size={14}/> Zurück
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-8 bg-slate-50">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {exercises.filter(ex => ex.trainingBlock === currentRequiredBlocks[selectingForSlot]).length > 0 ? (
                                            exercises.filter(ex => ex.trainingBlock === currentRequiredBlocks[selectingForSlot]).map(ex => (
                                                <div 
                                                    key={ex.id} 
                                                    onClick={() => handleSelectExerciseForPlan(ex)} 
                                                    className="bg-white rounded-[2rem] border-2 border-slate-100 overflow-hidden shadow-sm hover:border-emerald-600 hover:shadow-xl transition-all cursor-pointer group flex flex-col"
                                                >
                                                    <div className="h-40 bg-slate-900 relative">
                                                        {ex.mediaType === 'image' ? (
                                                            <MediaImage exercise={ex} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all"/>
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center bg-slate-800 text-slate-400">
                                                                <Icon name="play-circle" size={36} className="text-emerald-500"/>
                                                            </div>
                                                        )}
                                                        
                                                        {ex.ageGroup.includes(plannerAge) && (
                                                            <div className="absolute top-3 left-3 bg-emerald-500 text-white px-3 py-1 text-[9px] font-black rounded-full uppercase shadow-md flex items-center gap-1">
                                                                <Icon name="check" size={10}/> Altersgerecht
                                                            </div>
                                                        )}

                                                        <div className="absolute top-3 right-3 bg-slate-900/80 text-white px-2.5 py-0.5 text-[9px] font-black rounded-full uppercase">
                                                            {ex.medium || 'Trainingsform'}
                                                        </div>
                                                    </div>

                                                    <div className="p-5 flex-1 flex flex-col justify-between">
                                                        <h4 className="font-black text-slate-800 uppercase text-sm leading-tight mb-2">{ex.title}</h4>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-400 uppercase pt-2 border-t border-slate-100">
                                                            <span>{ex.players?.split(' ')[0]}</span>
                                                            <span>{ex.duration}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="col-span-full text-center py-20 text-slate-400 font-black uppercase text-sm">
                                                Keine Übungen für diesen Baustein vorhanden.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {selectedExercise && (
                        <div className="fixed inset-0 z-[100] bg-slate-950/95 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-6xl max-h-[95vh] overflow-hidden flex flex-col md:flex-row shadow-2xl modal-anim border-2 border-slate-100">
                                <div className="md:w-1/2 bg-slate-950 flex items-center justify-center p-4 relative min-h-[280px]">
                                    {isLoadingMedia ? (
                                        <div className="text-center text-white">
                                            <div className="spinner mx-auto mb-3"></div>
                                            <p className="text-xs font-black uppercase tracking-widest text-emerald-400">Lade Medium...</p>
                                        </div>
                                    ) : selectedExercise.mediaType === 'video' ? (
                                        <video src={exerciseMediaUrl} controls autoPlay className="max-w-full max-h-[80vh] rounded-2xl shadow-2xl" />
                                    ) : (
                                        <img 
                                            src={exerciseMediaUrl || selectedExercise.mediaUrl} 
                                            className="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain" 
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.src = 'https://placehold.co/600x400/0f172a/ffffff?text=Bild+Fehler';
                                            }}
                                        />
                                    )}

                                    <div className="absolute top-6 left-6">
                                        <span className="bg-emerald-700 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-xl">
                                            {selectedExercise.medium || 'Trainingsform'}
                                        </span>
                                    </div>
                                </div>

                                <div className="md:w-1/2 p-8 sm:p-12 overflow-y-auto space-y-8 relative">
                                    <button 
                                        onClick={() => setSelectedExercise(null)} 
                                        className="absolute top-8 right-8 text-3xl font-black bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center hover:bg-slate-200 transition-all text-slate-600"
                                    >
                                        ×
                                    </button>

                                    <div className="border-b-2 border-slate-100 pb-6 pr-12">
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            <span className="sfw-bg text-white text-[10px] font-black px-3.5 py-1 rounded-full uppercase tracking-widest">{selectedExercise.trainingBlock}</span>
                                            <span className="bg-emerald-50 text-emerald-800 text-[10px] font-black px-3.5 py-1 rounded-full uppercase tracking-widest border border-emerald-100">{selectedExercise.ageGroup?.join(', ')}</span>
                                        </div>
                                        <h2 className="text-3xl font-black sfw-green uppercase leading-tight">{selectedExercise.title}</h2>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 text-[11px] font-bold uppercase tracking-widest text-slate-500">
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100"><Icon name="maximize" className="sfw-green mb-1" /><br/>Feld: <span className="text-slate-900 block mt-0.5">{selectedExercise.fieldSize}</span></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100"><Icon name="users" className="sfw-green mb-1" /><br/>Spieler: <span className="text-slate-900 block mt-0.5">{selectedExercise.players}</span></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100"><Icon name="clock" className="sfw-green mb-1" /><br/>Dauer: <span className="text-slate-900 block mt-0.5">{selectedExercise.duration}</span></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100"><Icon name="shield" className="sfw-green mb-1" /><br/>Phase: <span className="text-slate-900 block mt-0.5">{Array.isArray(selectedExercise.gamePhase) ? selectedExercise.gamePhase.join(' & ') : selectedExercise.gamePhase}</span></div>
                                    </div>

                                    <div className="space-y-6">
                                        <div>
                                            <h4 className="label-dark sfw-green font-bold">Ablauf & Durchführung</h4>
                                            <p className="text-sm font-bold text-slate-700 leading-relaxed whitespace-pre-wrap">{selectedExercise.procedure}</p>
                                        </div>
                                        <div>
                                            <h4 className="label-dark sfw-green font-bold">Coaching-Punkte</h4>
                                            <p className="text-sm font-bold text-slate-700 leading-relaxed whitespace-pre-wrap">{selectedExercise.coachingPoints}</p>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div className="bg-emerald-50 p-5 rounded-2xl border-l-4 border-emerald-600">
                                                <h5 className="label-dark text-emerald-800">Erleichterung</h5>
                                                <p className="text-xs font-bold text-emerald-950">{selectedExercise.easier || '-'}</p>
                                            </div>
                                            <div className="bg-red-50 p-5 rounded-2xl border-l-4 border-red-600">
                                                <h5 className="label-dark text-red-800">Erschwerung</h5>
                                                <p className="text-xs font-bold text-red-950">{selectedExercise.harder || '-'}</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {(selectedExercise.youtubeLink || selectedExercise.instagramLink) && (
                                        <div className="flex gap-3 pt-2">
                                            {selectedExercise.youtubeLink && (
                                                <a href={selectedExercise.youtubeLink} target="_blank" rel="noreferrer" className="flex items-center gap-2 bg-red-600 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-md hover:scale-105 transition-all">
                                                    <Icon name="youtube" size={14}/> YouTube
                                                </a>
                                            )}
                                            {selectedExercise.instagramLink && (
                                                <a href={selectedExercise.instagramLink} target="_blank" rel="noreferrer" className="flex items-center gap-2 bg-gradient-to-tr from-yellow-400 to-purple-600 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-md hover:scale-105 transition-all">
                                                    <Icon name="instagram" size={14}/> Instagram
                                                </a>
                                            )}
                                        </div>
                                    )}

                                    <div className="flex flex-wrap gap-3 pt-6 border-t-2 border-slate-100">
                                        <button onClick={() => performExport(selectedExercise)} className="flex-1 sfw-bg text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg flex items-center justify-center gap-2 hover:sfw-bg-dark transition-all">
                                            <Icon name="download" size={16}/> PDF Export
                                        </button>
                                        
                                        {canEditContent && (
                                            <>
                                                <button onClick={() => handleEdit(selectedExercise)} className="px-6 py-4 bg-emerald-50 text-emerald-800 font-black text-xs rounded-2xl hover:bg-emerald-100 transition-all flex items-center gap-2">
                                                    <Icon name="edit" size={16}/> Bearbeiten
                                                </button>
                                                <button onClick={() => handleDeletePrompt(selectedExercise)} className="px-6 py-4 bg-slate-100 text-slate-500 font-black text-xs rounded-2xl hover:bg-red-50 hover:text-red-600 transition-all flex items-center gap-2">
                                                    <Icon name="trash-2" size={16}/> Löschen
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {modalAlert && (
                        <div className="fixed inset-0 z-[200] bg-slate-950/80 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-[2.5rem] max-w-sm w-full text-center space-y-6 shadow-2xl modal-anim border-2 border-slate-200">
                                <div className="w-16 h-16 bg-emerald-50 text-emerald-800 rounded-full flex items-center justify-center mx-auto">
                                    <Icon name="circle-info" size={32} />
                                </div>
                                <div>
                                    <h3 className="text-2xl font-black uppercase text-slate-800">{modalAlert.title}</h3>
                                    <p className="text-xs font-bold text-slate-500 mt-2 leading-relaxed">{modalAlert.msg}</p>
                                </div>
                                <div className="flex gap-3 pt-2">
                                    {modalAlert.showCancel && (
                                        <button 
                                            onClick={() => setModalAlert(null)}
                                            className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-xl text-xs uppercase"
                                        >
                                            Abbrechen
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => {
                                            if (modalAlert.onConfirm) modalAlert.onConfirm();
                                            else setModalAlert(null);
                                        }}
                                        className="flex-1 py-3.5 sfw-bg hover:sfw-bg-dark text-white font-black rounded-xl text-xs uppercase shadow-md"
                                    >
                                        Bestätigen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
